<div class="dashboard-root d-flex">
  <!-- Sidebar -->
  <app-sidebar [open]="sidebarOpen" (closeRequest)="sidebarOpen = false"></app-sidebar>

  <!-- Main content -->
  <div class="content-area d-flex flex-column flex-grow-1">
    <!-- Topbar -->
    <nav class="navbar topbar navbar-light bg-white border-bottom px-3">
      <div class="d-flex align-items-center">
        <button class="btn btn-outline-primary btn-sm me-3" (click)="toggleSidebar()">
          <i class="bi" [ngClass]="sidebarOpen ? 'bi-x-lg' : 'bi-list'"></i>
        </button>
        <span class="fs-6 fw-semibold">Panel de administración</span>
      </div>

      <div class="d-flex align-items-center">
        <!-- Aquí puedes añadir avatar, nombre, dropdown de usuario -->
        <div class="me-3 text-end d-none d-md-block">
          <div class="small text-muted">Cuenta</div>
          <div class="fw-medium">Administrador</div>
        </div>
        <div class="avatar rounded-circle bg-secondary text-white d-flex align-items-center justify-content-center" style="width:40px;height:40px;">
          <i class="bi bi-person"></i>
        </div>
      </div>
    </nav>

    <!-- Content body -->
    <main class="p-4 flex-grow-1 overflow-auto">
      <!-- Aquí van los child routes / widgets -->
      <router-outlet></router-outlet>

      <!-- Ejemplo de contenido provisional -->
      <div class="container-fluid">
        <div class="row g-3">
          <div class="col-12">
            <div class="card p-3">
              <h5 class="mb-1">Bienvenido al panel</h5>
              <p class="text-muted mb-0">Usa el menú izquierdo para navegar entre secciones (Médicos, Pacientes, Usuarios, Ajustes).</p>
            </div>
          </div>
        </div>
      </div>

    </main>
  </div>
</div>
